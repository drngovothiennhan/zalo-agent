name = "zalo-agent-nhan"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Keep variables set in the dashboard (ALLOWED_IDS) when deploying from Git
keep_vars = true

workers_dev = true
routes = [{ pattern = "zalobot.hiutmc.com", custom_domain = true }]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "zalo-agent-db"
database_id = "47865ada-7560-4212-8da6-3e77accd92d4"

# Check due reminders every minute
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
